[package]
name = "rust3d"
version = "0.1.0"
edition = "2021"
description = "Beräkningsmotor för 4D-planeringens Rust-labb: IFC, geometri, träffsökning, punktmoln. Inga beroenden."

[lib]
crate-type = ["cdylib", "rlib"]

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
panic = "abort"
strip = true
