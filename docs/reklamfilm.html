<!doctype html>
<html lang="sv">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>3D-EDITORN – Officiell trailer</title>
<style>

  button.q{border-color:#ffffff33;opacity:.7}

  #hud:hover{opacity:.9}
  #hud b{cursor:pointer;margin-left:14px;font-weight:400}
</style>
</head>
<body>
<canvas id="c"></canvas>
<div id="start">
  <p>Ett Trimble Connect-tillägg presenterar</p>
  <h1>3D-EDITORN</h1>
  <p>Officiell trailer · 62 sekunder</p>
  <div class="b"><button id="go">▶ Spela med ljud</button><button id="go2" class="q">Utan ljud</button></div>
  <p style="font-size:10px;opacity:.35">Mellanslag = paus · R = börja om · M = ljud · F = helskärm</p>
</div>
<div id="hud"><span id="tc">0:00</span><b id="bM">ljud</b><b id="bR">om</b><b id="bF">helskärm</b></div>
<script>
"use strict";

function pr(x, y, z) { const q = C, dx = x - q.p[0], dy = y - q.p[1], dz = z - q.p[2], cz = dx * q.f[0] + dy * q.f[1] + dz * q.f[2]; if (cz < 0.5) return null; P[0] = W / 2 + (dx * q.r[0] + dy * q.r[1] + dz * q.r[2]) / cz * F; P[1] = H / 2 - (dx * q.u[0] + dy * q.u[1] + dz * q.u[2]) / cz * F; P[2] = cz; return P; }

/* ---------- scenschema ---------- */
const CAP = [

  [7.0, 14.0, "PUNKTMOLN", "Miljontals punkter. Din verklighet, helt exakt."],
  [16.0, 23.2, "IFC-MODELLER", "Hela bygget. Vecka för vecka. I samma scen."],
  [25.0, 32.2, "KLIPP EXAKT DÄR DU PEKAR", "Profil, snitt och höjder – på sekunden."],

/* ---------- rendering ---------- */

  }

  o.fillStyle = "#ffffff"; for (const p of fl) { const q = pr(p.x, p.y, p.z); if (q) { const r = clamp(F * 0.06 / q[2], 1.5, 5) * (W / 1300 + 0.5); o.globalAlpha = 0.9; o.fillRect(q[0] - r / 2, q[1] - r / 2, r, r); } } o.globalAlpha = 1;

    if (q1 && q2) { const x2 = q2[0], y2 = q2[1]; for (const [w, al, col] of [[16, 0.08, "#ffd54a"], [8, 0.2, "#ffd54a"], [3, 1, "#fff6c9"]]) { o.lineWidth = w; o.strokeStyle = col; o.globalAlpha = al * a; o.lineCap = "round"; o.beginPath(); o.moveTo(x1, y1); o.lineTo(x2, y2); o.stroke(); } o.globalAlpha = a; o.fillStyle = "#fff"; for (const [x, y] of [[x1, y1], [x2, y2]]) { o.beginPath(); o.arc(x, y, 6 * (W / 1300 + 0.5), 0, 6.3); o.fill(); } }

    if (qm) { const r = (9 + 3 * Math.sin(t * 9)) * (W / 1300 + 0.5), gg = o.createRadialGradient(qm[0], qm[1], 0, qm[0], qm[1], r * 2.5); gg.addColorStop(0, "rgba(255,255,255,.9)"); gg.addColorStop(1, "rgba(255,200,60,0)"); o.fillStyle = gg; o.globalAlpha = a; o.beginPath(); o.arc(qm[0], qm[1], r * 2.5, 0, 6.3); o.fill(); }

function title(t) {

  text("KOMMER TILL ETT BYGGE NÄRA DIG", W / 2, y + fs * 1.15, fs * 0.13, ease(seg(t, 53.5, 54.5)) * (1 - ease(seg(t, 54.8, 55.5))), fs * 0.08, "c", 300);
  const rows = [["I HUVUDROLLEN", "Punktmolnet"], ["MEDVERKANDE", "IFC-modellerna · Profillinjen · Saxen"], ["MUSIK", "Skrivet i en webbläsare"], ["IDÉ OCH PRODUKTION", "Victor Falk"], ["REGI & KOD", "Claude"]];
  rows.forEach(([a, b], i) => { const st = 55.5 + i * 0.9, k2 = ease(seg(t, st, st + 0.8)) * (1 - ease(seg(t, 60.6, 61.8))); text(a, W / 2, H * 0.665 + i * fs * 0.16, fs * 0.075, k2 * 0.55, fs * 0.04, "c", 300); text(b, W / 2, H * 0.665 + i * fs * 0.16 + fs * 0.085, fs * 0.095, k2, fs * 0.03, "c", 400); });
  text("TILLÅTEN FRÅN ALLA ÅLDRAR – MEN MEST FÖR DEM MED MASSOR AV PUNKTER", W / 2, H * 0.915, fs * 0.075, ease(seg(t, 58.5, 59.5)) * (1 - ease(seg(t, 61.4, 62))) * 0.6, fs * 0.03, "c", 300);
}

/* ---------- efterbehandling ---------- */
let gseed = 0;
function present(t) {
  ctx.setTransform(1, 0, 0, 1, 0, 0); ctx.globalCompositeOperation = "source-over"; ctx.globalAlpha = 1; ctx.fillStyle = "#000"; ctx.fillRect(0, 0, W, H);
  const bar = H * (0.5 - 0.5 * (W / H > 2.39 ? 1 : (W / 2.39) / H));   // 2,39:1-bildformat
  ctx.save(); ctx.beginPath(); ctx.rect(0, bar, W, H - bar * 2); ctx.clip();
  let glitch = 0; for (const b of BOUND) { const d = Math.abs(t - b); if (d < 0.22) glitch = 1 - d / 0.22; }
  if (glitch > 0) { const n = 14; for (let i = 0; i < n; i++) { const y0 = Math.floor(H / n * i), dx = Math.sin(i * 12.9 + t * 80) * 0.5 * glitch * W * 0.06; ctx.drawImage(oc, 0, y0, W, H / n + 1, dx, y0, W, H / n + 1); } }
  else ctx.drawImage(oc, 0, 0);
  // bloom (nedskalad kopia ritad additivt)
  s.globalCompositeOperation = "source-over"; s.drawImage(oc, 0, 0, sm.width, sm.height); ctx.globalCompositeOperation = "lighter"; ctx.imageSmoothingEnabled = true; ctx.globalAlpha = 0.9; ctx.drawImage(sm, 0, 0, W, H); ctx.globalAlpha = 0.5; ctx.drawImage(sm, -W * 0.01, -H * 0.01, W * 1.02, H * 1.02);
  if (glitch > 0) { ctx.globalAlpha = 0.5 * glitch; ctx.drawImage(oc, W * 0.012 * glitch, 0); }   // kromatiskt skift
  ctx.globalAlpha = 1; ctx.globalCompositeOperation = "source-over";
  const v = ctx.createRadialGradient(W / 2, H / 2, Math.min(W, H) * 0.25, W / 2, H / 2, Math.max(W, H) * 0.75); v.addColorStop(0, "rgba(0,0,0,0)"); v.addColorStop(1, "rgba(0,0,0,.72)"); ctx.fillStyle = v; ctx.fillRect(0, 0, W, H);
  // filmkorn + flimmer
  if (((gseed++) & 1) === 0) { const id = g.createImageData(256, 256), d = id.data; for (let i = 0; i < d.length; i += 4) { const n = 120 + Math.random() * 135; d[i] = d[i + 1] = d[i + 2] = n; d[i + 3] = 26; } g.putImageData(id, 0, 0); }
  ctx.globalCompositeOperation = "overlay"; ctx.fillStyle = ctx.createPattern(gr, "repeat"); ctx.translate(Math.random() * 256, Math.random() * 256); ctx.fillRect(-256, -256, W + 256, H + 256); ctx.setTransform(1, 0, 0, 1, 0, 0);
  ctx.globalCompositeOperation = "source-over"; ctx.fillStyle = `rgba(0,0,0,${0.03 * Math.random()})`; ctx.fillRect(0, 0, W, H);
  const fade = Math.max(1 - seg(t, 0, 1.2), seg(t, 61.2, 62)); if (fade > 0) { ctx.fillStyle = `rgba(0,0,0,${fade})`; ctx.fillRect(0, 0, W, H); }
  ctx.restore();
}

/* ---------- ljud (WebAudio, syntetiserat) ---------- */
let ac = null, master = null, muted = false;
function noiseBuf() { const b = ac.createBuffer(1, ac.sampleRate * 3, ac.sampleRate), d = b.getChannelData(0); for (let i = 0; i < d.length; i++) d[i] = Math.random() * 2 - 1; return b; }
function audioStart() {
  ac = new (window.AudioContext || window.webkitAudioContext)(); master = ac.createGain(); master.gain.value = muted ? 0 : 0.8; master.connect(ac.destination); const t0 = ac.currentTime + 0.1, nb = noiseBuf();
  const env = (gn, t, a, d, pk) => { gn.gain.setValueAtTime(0.0001, t); gn.gain.exponentialRampToValueAtTime(pk, t + a); gn.gain.exponentialRampToValueAtTime(0.0001, t + a + d); };
  const lp = ac.createBiquadFilter(); lp.type = "lowpass"; lp.frequency.setValueAtTime(140, t0); lp.frequency.exponentialRampToValueAtTime(1400, t0 + 48); lp.frequency.exponentialRampToValueAtTime(300, t0 + 62);
  const dg = ac.createGain(); dg.gain.setValueAtTime(0.0001, t0); dg.gain.exponentialRampToValueAtTime(0.22, t0 + 5); dg.gain.setValueAtTime(0.22, t0 + 58); dg.gain.exponentialRampToValueAtTime(0.0001, t0 + 62); lp.connect(dg); dg.connect(master);
  [55, 55.4, 82.4, 110.3].forEach(f => { const os = ac.createOscillator(); os.type = "sawtooth"; os.frequency.value = f; os.connect(lp); os.start(t0); os.stop(t0 + 62.5); });
  for (let b = 6; b < 48; b += 0.5) { const o2 = ac.createOscillator(), gn = ac.createGain(); o2.type = "sine"; o2.frequency.setValueAtTime(110, t0 + b); o2.frequency.exponentialRampToValueAtTime(48, t0 + b + 0.18); o2.connect(gn); gn.connect(master); env(gn, t0 + b, 0.01, 0.2, b < 41 ? 0.25 : 0.4); o2.start(t0 + b); o2.stop(t0 + b + 0.3); }
  const sc = [220, 261.6, 329.6, 392, 440, 523.3, 659.3, 784];
  for (let i = 56; i < 192; i++) { const b = i / 4; if (b > 33 && b < 41 && i % 2) continue; const f = sc[(i * 3) % sc.length] * (b > 41 ? 2 : 1), o2 = ac.createOscillator(), gn = ac.createGain(); o2.type = "triangle"; o2.frequency.value = f; o2.connect(gn); gn.connect(master); env(gn, t0 + b, 0.005, 0.18, 0.035 + 0.05 * seg(b, 14, 41)); o2.start(t0 + b); o2.stop(t0 + b + 0.3); }
  BOUND.forEach(b => {
    const n = ac.createBufferSource(); n.buffer = nb; const bp = ac.createBiquadFilter(); bp.type = "bandpass"; bp.Q.value = 1.4; bp.frequency.setValueAtTime(300, t0 + b - 2); bp.frequency.exponentialRampToValueAtTime(7000, t0 + b);
    const gn = ac.createGain(); gn.gain.setValueAtTime(0.0001, t0 + b - 2); gn.gain.exponentialRampToValueAtTime(0.35, t0 + b - 0.02); gn.gain.exponentialRampToValueAtTime(0.0001, t0 + b + 0.7); n.connect(bp); bp.connect(gn); gn.connect(master); n.start(t0 + b - 2); n.stop(t0 + b + 0.8);
    const o2 = ac.createOscillator(), g2 = ac.createGain(); o2.type = "sine"; o2.frequency.setValueAtTime(90, t0 + b); o2.frequency.exponentialRampToValueAtTime(26, t0 + b + 1.2); o2.connect(g2); g2.connect(master); env(g2, t0 + b, 0.01, 1.4, b === 48 ? 1 : 0.6); o2.start(t0 + b); o2.stop(t0 + b + 1.6);
  });
  [110, 164.8, 220, 277.2, 329.6, 440].forEach(f => { const o2 = ac.createOscillator(), gn = ac.createGain(), fl = ac.createBiquadFilter(); fl.type = "lowpass"; fl.frequency.value = 2600; o2.type = "sawtooth"; o2.frequency.value = f; o2.connect(fl); fl.connect(gn); gn.connect(master); env(gn, t0 + 48, 0.08, 9, 0.07); o2.start(t0 + 48); o2.stop(t0 + 58); });
}

/* ---------- uppspelning ---------- */
const TOTAL = 62; let T = 0, last = 0, playing = false, ended = false;
function frame(now) {
  requestAnimationFrame(frame); const dt = Math.min(0.1, (now - last) / 1000); last = now;
  if (playing && !ended) { T += dt; if (T >= TOTAL) { T = TOTAL; ended = true; } }
  const t = clamp(T, 0, TOTAL); render(t); present(t);
  document.getElementById("tc").textContent = `${Math.floor(t / 60)}:${String(Math.floor(t % 60)).padStart(2, "0")}`;
}
function begin(sound) {
  muted = !sound; const st = document.getElementById("start"); st.style.opacity = 0; setTimeout(() => st.style.display = "none", 800);
  T = 0; ended = false; playing = true; if (ac) { try { ac.close(); } catch (e) { /* redan stängd */ } ac = null; } try { audioStart(); } catch (e) { console.warn("Ljud", e); }
}
function restart() { begin(!muted); }
function pause() { playing = !playing; if (ac) { playing ? ac.resume() : ac.suspend(); } }
function mute() { muted = !muted; if (master) master.gain.value = muted ? 0 : 0.8; }
function fsT() { document.fullscreenElement ? document.exitFullscreen() : document.documentElement.requestFullscreen && document.documentElement.requestFullscreen(); }
document.getElementById("go").onclick = () => begin(true); document.getElementById("go2").onclick = () => begin(false);
document.getElementById("bM").onclick = mute; document.getElementById("bR").onclick = restart; document.getElementById("bF").onclick = fsT;
addEventListener("keydown", e => { if (e.key === " ") { e.preventDefault(); pause(); } else if (e.key === "r" || e.key === "R") restart(); else if (e.key === "m" || e.key === "M") mute(); else if (e.key === "f" || e.key === "F") fsT(); });
requestAnimationFrame(t => { last = t; frame(t); });
/* förhandsgranskning: ?t=30 hoppar till en tidpunkt, utan ljud */
{ const q = new URLSearchParams(location.search).get("t"); if (q != null) { T = Number(q) || 0; playing = false; document.getElementById("start").style.display = "none"; } }
