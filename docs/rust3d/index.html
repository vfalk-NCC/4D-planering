<!doctype html>
<html lang="sv">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>3D-editor · Rust</title>
<link rel="stylesheet" href="style.css?v=2">
</head>
<body class="mode-model">
<div id="app">
<header class="topbar">
  <a class="brand" href="../" title="Tillbaka till 4D-planering"><span class="logo">4D</span></a>
  <button class="proj" id="projBtn" title="Byt modell"><span id="projName">Ingen modell</span><i data-ic="chev"></i></button>
  <nav class="tabsTop" id="topTabs">
    <button data-tab="model" class="on">Modell</button>
    <button data-tab="drawings">Ritningar</button>
    <button data-tab="plan">Tidplan</button>
    <button data-tab="docs">Dokument</button>
    <button data-tab="qty">Mängdning</button>
    <button data-tab="clash">Kollisionskontroll</button>
  </nav>
  <div class="grow"></div>
  <label class="gsearch"><i data-ic="search"></i><input id="q" type="search" placeholder="Sök i modell, objekt, ritningar…" autocomplete="off" spellcheck="false"><kbd id="qk">Ctrl K</kbd><span id="qn" class="qn"></span></label>
  <button class="btn sm" id="bOpen" title="Öppna modell eller punktmoln"><i data-ic="folder"></i>Öppna</button><button class="btn sm primary" id="bExport" disabled title="Spara en ny IFC-fil med dina ändringar">Spara ändringar</button><button class="tbtn" id="bWs" title="Arbetsytor – spara och byt layout"><i data-ic="split"></i></button><button class="tbtn" id="bHelp" title="Genvägar och navigering"><i data-ic="help"></i></button>
  <button class="tbtn" id="bSettings" title="Inställningar"><i data-ic="gear"></i></button>
  <button class="tbtn" id="bTheme" title="Ljust/mörkt"><i data-ic="moon"></i></button>
  <span class="avatar" id="avatar" title="Inloggad">VF</span>
  <input id="file" type="file" hidden accept=".ifc,.xyz,.txt,.csv,.ply,.las">
</header>

<aside id="left" class="side left">
  <div class="shead"><i data-ic="cube"></i><b id="lTitle">Modell</b><span class="grow"></span><button class="x" id="lClose" title="Dölj panelen"><i data-ic="close"></i></button></div>
  <div id="lBody" class="sbody"></div>
</aside>

<main class="stage" id="stage">
  <canvas id="gl"></canvas><canvas id="ov"></canvas>

  <div class="glass toolbar tl" id="tools">
    <button data-tool="select" class="on" title="Välj (V)"><i data-ic="select"></i><span>Välj</span></button>
    <button data-tool="measure" title="Mät (M)"><i data-ic="ruler"></i><span>Mät</span></button>
    <button data-tool="info" title="Info (I)"><i data-ic="info"></i><span>Info</span></button>
    <button data-tool="section" title="Skärning (C)"><i data-ic="section"></i><span>Skärning</span></button>
    <button data-tool="comment" title="Kommentar (K)"><i data-ic="comment"></i><span>Kommentar</span></button>
  </div>

  <div class="tr" id="trbox">
    <div class="cube" id="cube"><div class="cube3d" id="cube3d">
      <div class="f f-front" data-v="front">FRAM</div><div class="f f-back" data-v="back">BAK</div><div class="f f-right" data-v="right">HÖGER</div><div class="f f-left" data-v="left">VÄNSTER</div><div class="f f-top" data-v="top">TOPP</div><div class="f f-bottom" data-v="bottom">BOTTEN</div></div>
      <button class="ar l" data-rot="-1" title="Vrid vänster"><i data-ic="chev" ></i></button><button class="ar r" data-rot="1" title="Vrid höger"><i data-ic="chev"></i></button></div>
    <div class="glass vbar" id="vbar">
      <button id="vHome" title="Anpassa till modellen (F)"><i data-ic="home"></i></button>
      <button id="vZin" title="Zooma in"><i data-ic="zin"></i></button>
      <button id="vZout" title="Zooma ut"><i data-ic="zout"></i></button>
      <button id="vWin" title="Zooma fönster"><i data-ic="zwin"></i></button>
      <button id="vOrtho" title="Perspektiv / ortografisk"><i data-ic="ortho"></i></button>
      <button id="vCmd" title="Snabbmeny (håll mittenknappen)"><i data-ic="cmd"></i></button>
    </div>
  </div>

  <div class="glass minimap" id="minimap"><canvas id="mm"></canvas>
    <div class="mmbar"><i data-ic="pin"></i><span>Planvy</span><span class="grow"></span><select id="mmLevel" title="Våning"></select><button id="mmBig" title="Visa större"><i data-ic="expand"></i></button></div></div>

  <div class="glass ctxbar" id="ctxbar" hidden></div>
  <div class="glass chip" id="chip" hidden></div>

  <div class="glass br" id="br">
    <button id="bUndo" title="Ångra (Ctrl+Z)"><i data-ic="undo"></i></button>
    <button id="bRedo" title="Gör om (Ctrl+Y)"><i data-ic="redo"></i></button>
    <button id="bHist" title="Ändringshistorik"><i data-ic="history"></i></button>
    <span class="sep"></span>
    <select id="vMode" title="Vy"><option value="3d">3D</option><option value="split">Delad vy</option><option value="multi">Flera paneler</option></select>
    <button id="bFull" title="Helskärm"><i data-ic="full"></i></button>
  </div>

  <div class="glass hist" id="hist" hidden></div>
  <div class="glass timeline" id="timeline" hidden></div>

  <div id="radial" class="radial" hidden></div>
  <div id="keys" class="keys" hidden></div>
  <div id="empty" class="empty"><div class="empty-card"><div class="big">Öppna en modell</div><p>Filen läses lokalt av en Rust-motor i din webbläsare. Inget laddas upp.</p>
    <div class="row center"><button class="btn primary" id="btnOpen2">Öppna IFC…</button><button class="btn" id="btnTC" hidden>Från Trimble Connect…</button><button class="btn" id="btnSample">Exempelmodell</button></div><small>Släpp en IFC (eller ett punktmoln) här.</small></div></div>
  <div id="busy" class="busy glass" hidden><div class="spin"></div><span id="busyT">Läser …</span></div>
  <div id="toast" class="toast" hidden></div>
</main>

<aside id="right" class="side right">
  <div class="shead"><b id="rTitle">Egenskaper</b><span class="grow"></span><button class="x" id="rMenu" title="Fler val"><i data-ic="more"></i></button><button class="x" id="rClose" title="Dölj panelen"><i data-ic="close"></i></button></div>
  <nav class="tabs" id="rtabs"><button data-t="obj" class="on">Objekt</button><button data-t="ifc">IFC</button><button data-t="meta">Metadata</button></nav>
  <div id="rBody" class="sbody"></div>
</aside>

<footer class="crumb"><span>4D</span><i data-ic="chev"></i><span id="cProj">–</span><i data-ic="chev"></i><span>3D-editor</span><span class="grow"></span><span id="hSt"></span><span id="hPerf"></span></footer>
</div>
<div id="dialog" class="dlg" hidden></div>
<script src="../github-storage.js"></script>
<script src="js/app.js?v=2" type="module"></script>
</body>
</html>
