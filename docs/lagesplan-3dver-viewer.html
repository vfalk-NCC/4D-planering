<!doctype html>
<html lang="sv"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Versionsjämförelse</title>
<style>
:root{--bg:#f1f5f9;--pn:#ffffff;--fg:#0f172a;--mut:#64748b;--line:#e2e8f0;--acc:#2563eb}
@media (prefers-color-scheme:dark){:root{--bg:#0f172a;--pn:#1e293b;--fg:#e2e8f0;--mut:#94a3b8;--line:#334155;--acc:#60a5fa}}
*{box-sizing:border-box}html,body{height:100%;margin:0}body{font:13px/1.4 system-ui,Segoe UI,Roboto,sans-serif;background:var(--bg);color:var(--fg);display:flex;flex-direction:column}
header{padding:8px 14px;background:var(--pn);border-bottom:1px solid var(--line);display:flex;flex-wrap:wrap;gap:6px 18px;align-items:baseline}
header h1{font-size:15px;margin:0}header span{color:var(--mut)}
main{flex:1;display:flex;min-height:0}#cv{flex:1;position:relative;min-width:0}#cv canvas{display:block;width:100%;height:100%}
aside{width:350px;max-width:46vw;background:var(--pn);border-left:1px solid var(--line);overflow:auto;padding:10px;display:flex;flex-direction:column;gap:10px}
@media (max-width:760px){main{flex-direction:column}aside{width:100%;max-width:none;max-height:46vh;border-left:0;border-top:1px solid var(--line)}}
h2{font-size:12px;text-transform:uppercase;letter-spacing:.05em;color:var(--mut);margin:0 0 4px}
.row{display:flex;flex-wrap:wrap;gap:6px;align-items:center}
button,select,input[type=search]{font:inherit;color:var(--fg);background:var(--pn);border:1px solid var(--line);border-radius:7px;padding:4px 8px}button{cursor:pointer}button.on{background:var(--acc);border-color:var(--acc);color:#fff}
.chip{display:flex;align-items:center;gap:6px;border:1px solid var(--line);border-radius:8px;padding:4px 8px;cursor:pointer;user-select:none}.chip.off{opacity:.4}.chip b{margin-left:auto}
.dot{width:10px;height:10px;border-radius:50%;flex:none}
.chips{display:grid;grid-template-columns:1fr 1fr;gap:5px}
#list{max-height:240px;overflow:auto;border:1px solid var(--line);border-radius:8px}
.it{display:flex;gap:6px;align-items:baseline;padding:3px 7px;border-bottom:1px solid var(--line);cursor:pointer}.it:hover{background:var(--bg)}.it.on{background:rgba(250,204,21,.25)}.it small{color:var(--mut)}
#sw{width:100%}#info{border:1px solid var(--line);border-radius:8px;padding:6px 8px;color:var(--mut)}#info b{color:var(--fg)}
details summary{cursor:pointer;color:var(--mut)}label.c{display:flex;gap:5px;align-items:center}
#bar{position:absolute;left:10px;top:10px;background:var(--pn);border:1px solid var(--line);border-radius:8px;padding:4px 8px;display:none;gap:8px;align-items:center}
#tip{position:absolute;pointer-events:none;background:#0f172acc;color:#fff;border-radius:6px;padding:2px 7px;font-size:12px;display:none}

#dv{position:absolute;inset:0;pointer-events:none;overflow:hidden;display:none}
#dvl{position:absolute;width:26px;pointer-events:auto;cursor:ew-resize;touch-action:none}
#dvl::after{content:"";position:absolute;left:50%;top:0;bottom:0;width:3px;margin-left:-1.5px;border-radius:2px;background:linear-gradient(#fff7d6,#fff7d6);box-shadow:0 0 0 1px #ffc61a,0 0 7px 2px #ffc61a,0 0 22px 6px rgba(255,198,26,.55),0 0 48px 12px rgba(255,198,26,.22);animation:dvp 2.8s ease-in-out infinite}
@keyframes dvp{0%,100%{opacity:.92}50%{opacity:1;filter:brightness(1.12)}}
@media (prefers-reduced-motion:reduce){#dvl::after{animation:none}}
#dvh{position:absolute;width:46px;height:46px;margin:-23px 0 0 -23px;border-radius:50%;background:rgba(255,255,255,.94);border:2px solid #ffc61a;box-shadow:0 0 0 3px rgba(255,198,26,.25),0 0 14px 3px #ffc61a,0 0 36px 10px rgba(255,198,26,.4);pointer-events:auto;cursor:grab;touch-action:none;display:flex;align-items:center;justify-content:center;color:#7a5a00;font-size:15px;font-weight:700;letter-spacing:-2px}
#dvh:active{cursor:grabbing}
.dvg{position:absolute;width:20px;height:20px;margin:-10px 0 0 -10px;border-radius:50%;background:#fff7d6;border:2px solid #ffc61a;box-shadow:0 0 10px 2px rgba(255,198,26,.8);pointer-events:auto;cursor:alias;touch-action:none}
.dvt{position:absolute;font-size:11px;font-weight:600;padding:1px 7px;border-radius:9px;background:rgba(15,23,42,.72);color:#fff;transform:translate(-50%,-50%);pointer-events:none;white-space:nowrap}
.seg{display:flex;gap:0}.seg button{border-radius:0}.seg button:first-child{border-radius:7px 0 0 7px}.seg button:last-child{border-radius:0 7px 7px 0}
#swpl label,#swscr label{display:flex;gap:6px;align-items:center}
.nr{width:78px}
</style></head><body>
<header><h1 id="ttl"></h1><span id="sub"></span></header>
<main><div id="cv"><div id="dv"><div id="dvl"></div><div class="dvg" id="dvg1" title="Dra för att vrida"></div><div class="dvg" id="dvg2" title="Dra för att vrida"></div><div id="dvh" title="Dra för att flytta snittet. Dubbelklick centrerar.">◀▶</div><span class="dvt" id="dvta">Äldre</span><span class="dvt" id="dvtb">Nyare</span></div><div id="bar"><span id="barl"></span></div><div id="tip"></div></div>
<aside>
<section id="vsec"><h2>Versioner</h2><div class="row"><label class="c">Äldre (A) <select id="va"></select></label><label class="c">Nyare (B) <select id="vb"></select></label></div><div class="row" id="vstep" style="margin-top:5px;display:none"><button id="vprev">◀ Föregående par</button><button id="vnext">Nästa par ▶</button><button id="vplay">▶ Spela</button></div></section>
<section><h2>Visa</h2><div class="row" id="modes"></div>
<div id="swrow" style="display:none;margin-top:6px">
<div class="row seg" id="swtype"><button data-t="screen" class="on">Skärmsvep</button><button data-t="plane">Snittplan i modellen</button></div>
<div id="swscr"><div class="row" style="margin-top:6px"><button id="scrc" title="Lägg dragaren mitt på skärmen, lodrät">Centrera</button><button id="scrv">Lodrät</button><button id="scrh">Vågrät</button><button id="scrf" title="Byt sida på äldre och nyare">⇄ Byt sida</button></div>
<div class="row" style="margin-top:6px"><label style="flex:1">Vinkel <input id="scra" type="range" min="0" max="359" step="1" value="90" style="flex:1"><span id="scrav" style="width:34px;text-align:right">90°</span></label></div>
<div class="row" style="margin-top:6px;color:var(--mut)">Dra i handtaget mitt på skärmen för att flytta snittet och i ändarna för att vrida. Dubbelklick på handtaget centrerar.</div></div>
<div id="swpl" style="display:none"><div class="row" style="margin-top:6px"><label>Riktning <select id="plo"><option value="vert">Lodrätt snitt</option><option value="z">Vågrätt (höjd)</option><option value="x">Tvärs X</option><option value="y">Tvärs Y</option></select></label><label class="c"><input id="plsh" type="checkbox" checked> Visa snittplanet</label></div>
<div class="row" id="plarow" style="margin-top:6px"><label style="flex:1">Vridning <input id="pla" type="range" min="0" max="359" step="1" value="0" style="flex:1"><span id="plav" style="width:34px;text-align:right">0°</span></label></div>
<div class="row" style="margin-top:6px"><label style="flex:1">Läge <input id="plp" type="range" min="-10" max="10" step="0.01" value="0" style="flex:1"></label><input id="pln" class="nr" type="number" step="0.01" value="0" title="Meter från modellens mitt"> m</div>
<div class="row" style="margin-top:6px"><button class="nu" data-d="-1">−1</button><button class="nu" data-d="-0.1">−0,1</button><button class="nu" data-d="0.1">+0,1</button><button class="nu" data-d="1">+1</button><button id="plf" title="Byt sida på äldre och nyare">⇄ Byt sida</button><button id="plc" title="Lägg snittet i modellens mitt">Mitten</button></div>
<div class="row" style="margin-top:6px"><button id="pk2" title="Klicka två punkter i modellen: ett lodrätt snitt läggs genom dem">Två punkter…</button><button id="pk1" title="Klicka en punkt: ett vågrätt snitt läggs i den punktens höjd">Höjd i punkt…</button></div>
<div class="row" id="pkh" style="margin-top:4px;color:var(--mut)">Dra i det gula snittplanet i vyn för att flytta det.</div></div>
</div>
<div id="ovrow" style="display:none;margin-top:6px" class="row"><label class="c">Äldre <input id="ca" type="color" value="#ef4444"></label><label class="c">Nyare <input id="cb" type="color" value="#2563eb"></label></div>
<div id="dfrow" style="margin-top:6px" class="row"><label class="c"><input id="old" type="checkbox" checked> Gammalt läge som röd skugga</label><label class="c">Oförändrat <select id="same"><option value="ghost">Spöke</option><option value="grey">Grått</option></select></label></div></section>
<section><h2>Bild</h2><div class="row"><button id="png" title="Sparar vyn du står i som en PNG-bild">📷 Spara bild</button><label class="c">Storlek <select id="pngs"><option value="1">Som skärmen</option><option value="2" selected>2× (skarp)</option><option value="4">4× (stor)</option></select></label><label class="c"><input id="pngl" type="checkbox" checked> Med förklaring</label></div></section>
<section><h2>Kategorier</h2><div class="chips" id="chips"></div><div class="row" style="margin-top:5px"><button id="all">Alla</button><button id="none">Ingen</button><button id="chg">Bara ändringar</button></div></section>
<section><h2>Klass</h2><details><summary id="clsum">Alla klasser</summary><div id="cls" style="max-height:160px;overflow:auto;margin-top:4px"></div></details><div class="row" style="margin-top:4px"><button id="clall">Alla</button><button id="clnone">Ingen</button></div></section>
<section><h2>Objekt <span id="cnt"></span></h2><input type="search" id="q" placeholder="Sök namn…" style="width:100%;margin-bottom:5px"><div id="list"></div><div class="row" style="margin-top:5px"><button id="csv">Exportera CSV</button><button id="fit">Återställ vy</button><button id="rst" title="Tar bort alla filter och går tillbaka till Skillnader">↺ Återställ filter</button></div></section>
<section id="info">Tryck på ett objekt i vyn eller i listan.</section>
<section class="row" style="color:var(--mut)" id="foot"></section>
</aside></main>
<script>/*__THREE__*/</script>

      var modeN = { diff: "Skillnader", overlay: "Överlägg", before: "Äldre", after: "Nyare", swipe: "Svep", blink: blinkA ? "Äldre (A)" : "Nyare (B)" }[st.mode];
      chip(M.file + " – " + modeN, f * 0.8, f * 0.8, null); chip("A: " + vl(ia) + "   B: " + vl(ib), f * 0.8, f * 3.2, null);
      var y = H - f * 2.7, x = f * 0.8; ORDER.forEach(function (k) { if (!st.show[k] || !cnt[k]) return; x += chip(NAME[k] + " " + cnt[k], x, y, COL[k]) + f * 0.4; if (x > W - f * 14) { x = f * 0.8; y -= f * 2.2; } });
      if (st.mode === "overlay") { chip("Äldre", W - f * 11, H - f * 2.7, st.colA); chip("Nyare", W - f * 5.6, H - f * 2.7, st.colB); }
    }
    c2.toBlob(function (b) { if (!b) return; var a = document.createElement("a"); a.href = URL.createObjectURL(b); a.download = ("Versionsjamforelse " + M.file.replace(/\.ifc(zip)?$/i, "") + " " + V[ia].label + "-" + V[ib].label + " " + st.mode + ".png").replace(/[\\/:*?"<>|]/g, "_"); document.body.appendChild(a); a.click(); a.remove(); setTimeout(function () { URL.revokeObjectURL(a.href); }, 6000); }, "image/png");
  }
  $("png").onclick = savePng;
  $("rst").onclick = function () { ORDER.forEach(function (k) { st.show[k] = true; }); classes.forEach(function (c) { st.cls[c] = true; }); st.q = ""; $("q").value = ""; st.old = true; $("old").checked = true; st.same = "ghost"; $("same").value = "ghost"; select(-1); chips(); clsUi(); setMode("diff"); list(); home(); draw(); };
  $("csv").onclick = function () {
    var q = function (v) { v = String(v == null ? "" : v); return /[;"\n]/.test(v) ? '"' + v.replace(/"/g, '""') + '"' : v; }, L = [["Typ", "Namn", "Klass", "Anmärkning", "Volym A (m3)", "Volym B (m3)"].join(";")];
    objs.filter(vis).forEach(function (o) { L.push([NAME[o.s], o.n, DATA.clsNames[o.c] || o.c, o.w, o.va == null ? "" : String(o.va).replace(".", ","), o.vb == null ? "" : String(o.vb).replace(".", ",")].map(q).join(";")); });
    var a = document.createElement("a"); a.href = URL.createObjectURL(new Blob(["﻿" + L.join("\r\n")], { type: "text/csv;charset=utf-8" })); a.download = "Versionsjamforelse.csv"; document.body.appendChild(a); a.click(); a.remove();
  };
  window.__ver = { setPair: setPair, pair: function () { return [ia, ib]; }, versions: V, plane: plG, camera: cam, swipe: swipe, clipA: function () { return clipA; }, clipB: function () { return clipB; }, st: st, objs: objs, setMode: setMode, groups: function () { return groups; }, renderer: R };
  /* flera versioner: välj vilka två som jämförs, stega par för par eller spela upp */
  V.forEach(function (v, i) { [["va", ia], ["vb", ib]].forEach(function (q) { var o = document.createElement("option"); o.value = i; o.textContent = vl(i); $(q[0]).appendChild(o); }); });
  $("va").value = ia; $("vb").value = ib; if (V.length > 2) $("vstep").style.display = "";
  var playT = 0; function stopPlay() { if (playT) { clearInterval(playT); playT = 0; $("vplay").textContent = "▶ Spela"; } }
  function setPair(x, y) {
    st.sel = -1; applyPair(x, y); recount(); refreshClasses(); $("va").value = x; $("vb").value = y; subTitle();
    while (hi.children.length) { var c = hi.children[0]; hi.remove(c); c.geometry.dispose(); c.material.dispose(); }
    $("info").innerHTML = "Tryck på ett objekt i vyn eller i listan."; chips(); clsUi(); refresh();
  }
  $("va").onchange = function () { stopPlay(); setPair(+$("va").value, ib); }; $("vb").onchange = function () { stopPlay(); setPair(ia, +$("vb").value); };
  $("vprev").onclick = function () { stopPlay(); var y = ia, x = ia - 1; if (x < 0) { x = V.length - 2; y = V.length - 1; } setPair(x, y); };
  $("vnext").onclick = function () { stopPlay(); var x = ib, y = ib + 1; if (y >= V.length) { x = 0; y = 1; } setPair(x, y); };
  $("vplay").onclick = function () { if (playT) { stopPlay(); return; } $("vplay").textContent = "❚❚ Stoppa"; playT = setInterval(function () { var x = ib, y = ib + 1; if (y >= V.length) { x = 0; y = 1; } setPair(x, y); }, 1800); };
  chips(); clsUi(); size(); home(); setMode("diff"); list();
})();
