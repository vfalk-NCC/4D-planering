<!doctype html>
<html lang="sv"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Versionsjämförelse</title>
<style>
:root{--bg:#f1f5f9;--pn:#ffffff;--fg:#0f172a;--mut:#64748b;--line:#e2e8f0;--acc:#2563eb}
@media (prefers-color-scheme:dark){:root{--bg:#0f172a;--pn:#1e293b;--fg:#e2e8f0;--mut:#94a3b8;--line:#334155;--acc:#60a5fa}}
*{box-sizing:border-box}html,body{height:100%;margin:0}body{font:13px/1.4 system-ui,Segoe UI,Roboto,sans-serif;background:var(--bg);color:var(--fg);display:flex;flex-direction:column}
header{padding:8px 14px;background:var(--pn);border-bottom:1px solid var(--line);display:flex;flex-wrap:wrap;gap:6px 18px;align-items:baseline}
header h1{font-size:15px;margin:0}header span{color:var(--mut)}
main{flex:1;display:flex;min-height:0}#cv{flex:1;position:relative;min-width:0}#cv canvas{display:block;width:100%;height:100%}
aside{width:350px;max-width:46vw;background:var(--pn);border-left:1px solid var(--line);overflow:auto;padding:10px;display:flex;flex-direction:column;gap:10px}
@media (max-width:760px){main{flex-direction:column}aside{width:100%;max-width:none;max-height:46vh;border-left:0;border-top:1px solid var(--line)}}
h2{font-size:12px;text-transform:uppercase;letter-spacing:.05em;color:var(--mut);margin:0 0 4px}
.row{display:flex;flex-wrap:wrap;gap:6px;align-items:center}
button,select,input[type=search]{font:inherit;color:var(--fg);background:var(--pn);border:1px solid var(--line);border-radius:7px;padding:4px 8px}button{cursor:pointer}button.on{background:var(--acc);border-color:var(--acc);color:#fff}
.chip{display:flex;align-items:center;gap:6px;border:1px solid var(--line);border-radius:8px;padding:4px 8px;cursor:pointer;user-select:none}.chip.off{opacity:.4}.chip b{margin-left:auto}
.dot{width:10px;height:10px;border-radius:50%;flex:none}
.chips{display:grid;grid-template-columns:1fr 1fr;gap:5px}
#list{max-height:240px;overflow:auto;border:1px solid var(--line);border-radius:8px}
.it{display:flex;gap:6px;align-items:baseline;padding:3px 7px;border-bottom:1px solid var(--line);cursor:pointer}.it:hover{background:var(--bg)}.it.on{background:rgba(250,204,21,.25)}.it small{color:var(--mut)}
#sw{width:100%}#info{border:1px solid var(--line);border-radius:8px;padding:6px 8px;color:var(--mut)}#info b{color:var(--fg)}
details summary{cursor:pointer;color:var(--mut)}label.c{display:flex;gap:5px;align-items:center}
#bar{position:absolute;left:10px;top:10px;background:var(--pn);border:1px solid var(--line);border-radius:8px;padding:4px 8px;display:none;gap:8px;align-items:center}
#tip{position:absolute;pointer-events:none;background:#0f172acc;color:#fff;border-radius:6px;padding:2px 7px;font-size:12px;display:none}
</style></head><body>
<header><h1 id="ttl"></h1><span id="sub"></span></header>
<main><div id="cv"><div id="bar"><span id="barl"></span></div><div id="tip"></div></div>
<aside>
<section><h2>Visa</h2><div class="row" id="modes"></div>
<div id="swrow" style="display:none;margin-top:6px"><div class="row"><span id="swl" style="color:var(--mut)">Äldre ◀ ▶ Nyare</span><button id="swax" title="Lägg svepet tvärs vyns riktning nu">Efter vyn</button></div><input id="sw" type="range" min="0" max="1" step="0.002" value="0.5"></div>
<div id="ovrow" style="display:none;margin-top:6px" class="row"><label class="c">Äldre <input id="ca" type="color" value="#ef4444"></label><label class="c">Nyare <input id="cb" type="color" value="#2563eb"></label></div>
<div id="dfrow" style="margin-top:6px" class="row"><label class="c"><input id="old" type="checkbox" checked> Gammalt läge som röd skugga</label><label class="c">Oförändrat <select id="same"><option value="ghost">Spöke</option><option value="grey">Grått</option></select></label></div></section>
<section><h2>Kategorier</h2><div class="chips" id="chips"></div><div class="row" style="margin-top:5px"><button id="all">Alla</button><button id="none">Ingen</button><button id="chg">Bara ändringar</button></div></section>
<section><h2>Klass</h2><details><summary id="clsum">Alla klasser</summary><div id="cls" style="max-height:160px;overflow:auto;margin-top:4px"></div></details><div class="row" style="margin-top:4px"><button id="clall">Alla</button><button id="clnone">Ingen</button></div></section>
<section><h2>Objekt <span id="cnt"></span></h2><input type="search" id="q" placeholder="Sök namn…" style="width:100%;margin-bottom:5px"><div id="list"></div><div class="row" style="margin-top:5px"><button id="csv">Exportera CSV</button><button id="fit">Återställ vy</button><button id="rst" title="Tar bort alla filter och går tillbaka till Skillnader">↺ Återställ filter</button></div></section>
<section id="info">Tryck på ett objekt i vyn eller i listan.</section>
<section class="row" style="color:var(--mut)" id="foot"></section>
</aside></main>
<script>/*__THREE__*/</script>
