<!doctype html>
<html lang="sv"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>3D-vy</title>
<style>

*{box-sizing:border-box}html,body{height:100%;margin:0}body{font:13px/1.4 system-ui,Segoe UI,Roboto,sans-serif;background:var(--bg);color:var(--fg);display:flex;flex-direction:column}
header{padding:8px 14px;background:var(--pn);border-bottom:1px solid var(--line);display:flex;flex-wrap:wrap;gap:6px 18px;align-items:baseline}

main{flex:1;display:flex;min-height:0}#cv{flex:1;position:relative;min-width:0}#cv canvas{display:block;width:100%;height:100%}
aside{width:360px;max-width:46vw;background:var(--pn);border-left:1px solid var(--line);overflow:auto;padding:10px;display:flex;flex-direction:column;gap:10px}
@media (max-width:760px){main{flex-direction:column}aside{width:100%;max-width:none;max-height:46vh;border-left:0;border-top:1px solid var(--line)}}
h2{font-size:12px;text-transform:uppercase;letter-spacing:.05em;color:var(--mut);margin:0 0 4px}
.row{display:flex;flex-wrap:wrap;gap:6px;align-items:center}

.ly{display:flex;align-items:center;gap:6px;padding:3px 6px;border:1px solid var(--line);border-radius:8px;margin-bottom:4px}.ly span{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.ly small{color:var(--mut)}
.dot{width:10px;height:10px;border-radius:50%;flex:none}
#list{max-height:240px;overflow:auto;border:1px solid var(--line);border-radius:8px}
.it{display:flex;gap:6px;align-items:baseline;padding:3px 7px;border-bottom:1px solid var(--line);cursor:pointer}.it:hover{background:var(--bg)}.it.on{background:rgba(239,68,68,.22)}.it small{color:var(--mut)}
#info{border:1px solid var(--line);border-radius:8px;padding:6px 8px;color:var(--mut)}#info b{color:var(--fg)}#info table{width:100%;border-collapse:collapse;font-size:12px}#info td{padding:1px 6px 1px 0;vertical-align:top;word-break:break-word}#info td:first-child{color:var(--mut);white-space:nowrap}
#dbody{max-height:420px;overflow:auto;border:1px solid var(--line);border-radius:8px;background:var(--bg);padding:4px}
#dwrap{position:relative;display:inline-block;min-width:100%}#dwrap img{display:block;width:100%;height:auto;background:#fff}
.hot{position:absolute;cursor:pointer;background:rgba(245,158,11,.22);outline:1px solid rgba(245,158,11,.8);border-radius:2px}.hot.sel{background:rgba(239,68,68,.45);outline:2px solid #ef4444}
.tabs{display:flex;flex-wrap:wrap;gap:4px;margin-bottom:4px}.tabs button{border-radius:12px;padding:2px 9px}
label.c{display:flex;gap:5px;align-items:center}
</style></head><body>
<header><h1 id="ttl"></h1><span id="sub"></span></header>
<main><div id="cv"></div>
<aside>
<section><h2>Lager</h2><div id="lys"></div><div class="row"><button id="all">Alla</button><button id="none">Inga</button><button id="home" title="Hela modellen i bild">⌂ Hela</button></div></section>
<section><h2>Visa</h2><div class="row"><label class="c">Bakgrund <select id="bg"><option value="l">Ljus</option><option value="d">Mörk</option><option value="s">Himmel</option></select></label><label class="c" id="ptl">Punktstorlek <input id="pts" type="range" min="1" max="8" step="0.5" value="2" style="width:90px"></label></div>
<div class="row" style="margin-top:6px"><button id="png" title="Sparar vyn du står i som PNG">📷 Spara bild</button><label class="c">Storlek <select id="pngs"><option value="1">Som skärmen</option><option value="2">2×</option></select></label></div></section>
<section id="osec"><h2>Objekt <span id="cnt"></span></h2><input type="search" id="q" placeholder="Sök namn, stag nr, klass…" style="width:100%;margin-bottom:5px"><div id="list"></div></section>
<section id="info">Tryck på ett objekt i vyn, i listan eller på ritningen.</section>
<section id="dsec" style="display:none"><h2>Ritningar</h2><div class="tabs" id="dtabs"></div><div id="dbody"><div id="dwrap"></div></div><div class="row" style="margin-top:4px"><button id="dopen" title="Öppnar ritningsbilden i en ny flik">↗ Bild i ny flik</button></div><div class="row" style="color:var(--mut);margin-top:4px">Tryck på ett stag nr (orange fält) – vyn zoomar till stången.</div></section>
<section class="row" style="color:var(--mut)" id="foot"></section>
</aside></main>
