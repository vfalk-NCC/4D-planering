<!doctype html>
<html lang="sv">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>3D-editorn – videoguide</title>
<style>
  :root{--bg:#050b14;--ac:#4ea3ff;--tx:#e8f1ff}
  html,body{margin:0;height:100%;background:var(--bg);color:var(--tx);font-family:"Helvetica Neue",Arial,sans-serif;overflow:hidden}
  #wrap{position:fixed;inset:0 0 56px 0;display:flex;align-items:center;justify-content:center}
  canvas{max-width:100%;max-height:100%;aspect-ratio:1280/800;background:#000;box-shadow:0 0 60px #0008}
  #bar{position:fixed;left:0;right:0;bottom:0;height:56px;display:flex;align-items:center;gap:8px;padding:0 12px;background:#0a1626;border-top:1px solid #16304f;box-sizing:border-box;z-index:3}
  #bar button{background:#12263f;color:var(--tx);border:1px solid #1f3e63;border-radius:8px;height:34px;min-width:34px;padding:0 10px;font:inherit;font-size:13px;cursor:pointer}
  #bar button:hover,#bar button:focus-visible{background:var(--ac);color:#001022;outline:none}
  #bar button.on{background:#1d4f86;border-color:var(--ac)}
  #seek{flex:1;position:relative;height:34px;cursor:pointer;min-width:80px}
  #seek i{position:absolute;top:15px;left:0;right:0;height:4px;background:#1b3252;border-radius:2px}
  #seek b{position:absolute;top:15px;left:0;height:4px;background:var(--ac);border-radius:2px;width:0}
  #seek s{position:absolute;top:8px;width:2px;height:18px;background:#2b4d7a;margin-left:-1px}
  #tc{font-variant-numeric:tabular-nums;font-size:12px;opacity:.7;min-width:78px;text-align:center}
  #chs{display:flex;gap:4px;flex-wrap:nowrap;overflow-x:auto;max-width:42vw}
  #chs button{padding:0 8px;min-width:30px}
  #start{position:fixed;inset:0;z-index:5;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:18px;background:radial-gradient(ellipse at 50% 35%,#0d2240,#050b14 70%);text-align:center;padding:24px;box-sizing:border-box}
  #start h1{margin:0;font-weight:300;font-size:clamp(26px,5vw,52px);letter-spacing:.08em}
  #start p{margin:0;opacity:.65;max-width:560px;line-height:1.5}
  #start .b{display:flex;gap:12px;flex-wrap:wrap;justify-content:center}
  #start button{font:inherit;background:transparent;color:var(--tx);border:1px solid var(--ac);padding:14px 26px;font-size:15px;cursor:pointer;border-radius:8px}
  #start button:hover,#start button:focus-visible{background:var(--ac);color:#001022;outline:none}
  @media (max-width:760px){#chs{display:none}}
</style>
</head>
<body>
<div id="wrap"><canvas id="c" width="1280" height="800"></canvas></div>
<div id="bar">
  <button id="bp" title="Spela / pausa (mellanslag)">⏸</button>
  <span id="tc">0:00 / 0:00</span>
  <div id="seek" title="Hoppa i filmen"><i></i><b></b></div>
  <div id="chs"></div>
  <button id="bs" title="Hastighet">1×</button>
  <button id="bv" title="Berättarröst (V)">🔊 Röst</button>
  <button id="bf" title="Helskärm (F)">⛶</button>
</div>
<div id="start">
  <h1>Så använder du 3D-editorn</h1>
  <p>En videoguide i nio steg: från att öppna 3D-vyn och lägga in underlag, till snitt, profil, schakt och fyllning, minikarta och utskrift. Du kan hoppa mellan kapitlen när du vill.</p>
  <div class="b"><button id="g1">▶ Spela med berättarröst</button><button id="g2">Spela utan ljud</button></div>
  <p style="font-size:12px;opacity:.4">Mellanslag = paus · ←/→ = 5 s · 1–9 = kapitel · V = röst · F = helskärm</p>
</div>
<script>
"use strict";
const cv = document.getElementById("c"), X = cv.getContext("2d"), VW0 = 1280, VH0 = 800;
const clamp = (v, a = 0, b = 1) => Math.max(a, Math.min(b, v)), lerp = (a, b, t) => a + (b - a) * t, seg = (t, a, b) => clamp((t - a) / (b - a));

const fmt = n => Math.round(n).toLocaleString("sv-SE");

/* ================= Kapitel ================= */
const CH = [
  { n: "Öppna 3D-vyn", t0: 6, t1: 20, menu: -1, narr: "Börja i lägesplanen. Tryck på knappen 3D uppe till höger, så öppnas 3D-editorn med din byggplats.", steps: [[0, "Lägesplanen är din startpunkt"], [5.5, "Tryck på 3D-knappen"], [8, "3D-editorn öppnas"]] },
  { n: "Lägg in underlag", t0: 20, t1: 36, menu: 0, narr: "Öppna menyn Underlag och dra in dina filer. En PDF-ritning läggs ut på marken, en IFC-modell reser sig, och ett punktmoln visar verkligheten.", steps: [[0, "Öppna Underlag"], [3, "Dra in PDF-ritningen"], [6.5, "Dra in IFC-modellen"], [10, "Dra in punktmolnet"]] },
  { n: "Navigera", t0: 36, t1: 50, menu: -1, narr: "Håll vänster musknapp för att rotera. Hjulet zoomar, och Skift plus dra panorerar. Vill du känna platsen på riktigt, tryck Gå runt och promenera i modellen.", steps: [[0, "Rotera: dra med vänster knapp"], [4.5, "Zooma: mushjulet"], [8, "Panorera: Skift + dra"], [11, "Gå runt: känn platsen"]] },
  { n: "Placera objekt", t0: 50, t1: 66, menu: 1, narr: "Välj Objekt, plocka en tornkran eller bod och klicka där den ska stå. Objekten snappar mot underlaget, och du flyttar dem med musen.", steps: [[0, "Öppna Objekt"], [2.5, "Välj Tornkran"], [5, "Klicka där den ska stå"], [9, "Placera en bod"], [12, "Dra för att flytta – den snappar"]] },
  { n: "Snitt med saxen", t0: 66, t1: 80, menu: 3, narr: "Med saxen lägger du ett snitt genom hela scenen. Klicka på en yta, dra i reglaget för att flytta snittet, och vänd sida med pilknappen.", steps: [[0, "Välj Snitt (saxen)"], [3, "Klicka på en yta"], [5, "Dra i reglaget"], [11, "Vänd sida med ⇄"]] },
  { n: "Profil och klipp", t0: 80, t1: 100, menu: 4, narr: "Under Punktmoln väljer du Profil. Klicka ut punkt A och B, så ritas höjdprofilen. Slå på reglaget Klipp längs profilen för att klippa scenen exakt längs linjen. Du kan dra ändpunkterna och lägga plushöjder.", steps: [[0, "Punktmoln → Profil"], [3, "Klicka A och B"], [8, "Slå på ”Klipp längs profilen”"], [13, "Dra ändpunkten B"], [16, "Plushöjd: klicka i profilen"]] },
  { n: "Schakt och fyllning", t0: 100, t1: 116, menu: 2, narr: "Under Mät väljer du Volym. Klicka ut området, lägg till fler hörn med plus-knapparna, och se schakt och fyllning mot din nivå. Exportera volymen som IFC.", steps: [[0, "Mät → Volym"], [3, "Klicka ut hörnen"], [7, "Plus = fler hörn"], [10, "Se schakt och fyllning"], [13, "Exportera som IFC"]] },
  { n: "Minikarta och vyer", t0: 116, t1: 130, menu: 6, narr: "Minikartan visar var du är. Tryck i kartan så hamnar en markering på exakt den platsen i 3D. Spara dina bästa vinklar som vyer och hoppa tillbaka med ett klick.", steps: [[0, "Tryck i minikartan"], [4, "Markeringen visas i 3D"], [7, "Spara vyn"], [11, "Hoppa tillbaka med ett klick"]] },
  { n: "Skriv ut och utgåvor", t0: 130, t1: 144, menu: 7, narr: "Under Skriv ut sätter du ihop layouten. Spara veckans läge som en utgåva med namn och anteckning, och skapa PDF:en. Då kan du alltid gå tillbaka till exakt det som skickades ut.", steps: [[0, "Öppna Skriv ut"], [3, "Spara utgåva…"], [8, "Namnge: Vecka 45"], [10.5, "Skapa PDF"]] },
];
const TOTAL = 150;
const MENU = ["Underlag", "Objekt", "Mät", "Snitt ✂", "Punktmoln ☁", "Tidplan", "Vyer", "Skriv ut"];

/* ================= 3D-värld ================= */
const SZ = 50, N = 50, hgt = (x, y) => 2 * Math.sin(x * 0.12) * Math.cos(y * 0.1) + 0.7 * Math.sin(x * 0.33 + y * 0.21) * 0.5 - 2.2 * Math.exp(-((x - 7) ** 2 + (y + 5) ** 2) / 60);
const TER = []; for (let i = 0; i < N; i++) for (let j = 0; j < N; j++) { const x = (i / (N - 1) - 0.5) * SZ, y = (j / (N - 1) - 0.5) * SZ; TER.push({ x, y, z: hgt(x, y), r: Math.hypot(x, y) }); }
const BLD = [[-8, -6, 10, 7, 8, 0], [8, 6, 8, 8, 12, 0.25], [14, -10, 9, 6, 5, 0.5]].map(([x, y, w, d, h, o]) => ({ x, y, w, d, h, o, z0: hgt(x, y) - 0.2 }));
const KEY = [[0, 0.6, 0.5, 90, 0, 0, 0], [36, 0.6, 0.5, 86, 0, 0, 0], [41, 1.6, 0.45, 86, 0, 0, 0], [44, 1.6, 0.45, 56, 0, 0, 0], [46, 1.6, 0.45, 56, 0, 0, 0], [49, 1.6, 0.45, 56, -8, 5, 0], [50.6, 1.2, 0.5, 64, 0, 0, 0], [66, 1.2, 0.55, 64, 0, 0, 0], [70, 1.9, 0.5, 66, 0, 0, 0], [80, 1.9, 0.5, 66, 0, 0, 0], [84, 2.0, 0.85, 62, 0, 0, 0], [100, 2.0, 0.85, 62, 0, 0, 0], [104, 2.6, 0.7, 60, 0, -6, 0], [116, 2.6, 0.7, 60, 0, -6, 0], [120, 3.2, 0.5, 66, 0, 0, 0], [127, 3.2, 0.5, 66, 0, 0, 0], [129.5, 4.2, 0.5, 66, 0, 0, 0], [150, 4.6, 0.5, 90, 0, 0, 0]];
let C = null, VX = 200, VY = 40, VW = 1080, VH = 580, FOC = 640;
function setCam(t) {

  const yaw = L(1), pit = L(2), d = L(3), tx = L(4), ty = L(5), tz = L(6), cp = Math.cos(pit), px = tx + d * cp * Math.cos(yaw), py = ty + d * cp * Math.sin(yaw), pz = tz + d * Math.sin(pit), l = Math.hypot(px - tx, py - ty, pz - tz), f = [(tx - px) / l, (ty - py) / l, (tz - pz) / l];
  let r = [f[1], -f[0], 0]; const rl = Math.hypot(r[0], r[1]); r = [r[0] / rl, r[1] / rl, 0]; const u = [r[1] * f[2] - r[2] * f[1], r[2] * f[0] - r[0] * f[2], r[0] * f[1] - r[1] * f[0]]; C = { p: [px, py, pz], f, r, u };
}
const Q = [0, 0, 0];
function pr(x, y, z) { const dx = x - C.p[0], dy = y - C.p[1], dz = z - C.p[2], cz = dx * C.f[0] + dy * C.f[1] + dz * C.f[2]; if (cz < 0.5) return null; Q[0] = VX + VW / 2 + (dx * C.r[0] + dy * C.r[1] + dz * C.r[2]) / cz * FOC; Q[1] = VY + VH / 2 - (dx * C.u[0] + dy * C.u[1] + dz * C.u[2]) / cz * FOC; Q[2] = cz; return Q; }
const pt2 = (x, y, z) => { const q = pr(x, y, z); return q ? [q[0], q[1]] : null; };

/* ================= Ritprimitiver ================= */
function rr(x, y, w, h, r) { X.beginPath(); X.moveTo(x + r, y); X.arcTo(x + w, y, x + w, y + h, r); X.arcTo(x + w, y + h, x, y + h, r); X.arcTo(x, y + h, x, y, r); X.arcTo(x, y, x + w, y, r); X.closePath(); }
function T(s, x, y, size, col, al, w) { X.font = `${w || 400} ${size}px "Helvetica Neue",Arial,sans-serif`; X.fillStyle = col || "#e8f1ff"; X.textAlign = al || "left"; X.textBaseline = "middle"; X.fillText(s, x, y); }
function btn(x, y, w, h, label, on, a) { X.save(); X.globalAlpha = a == null ? 1 : a; rr(x, y, w, h, 7); X.fillStyle = on ? "#2a6fbf" : "#14263f"; X.fill(); X.strokeStyle = on ? "#7fc0ff" : "#26466f"; X.lineWidth = 1.2; X.stroke(); T(label, x + w / 2, y + h / 2 + 1, 14, "#e8f1ff", "center"); X.restore(); }
function panel(x, y, w, h, title, a) { X.save(); X.globalAlpha = a == null ? 1 : a; rr(x, y, w, h, 10); X.fillStyle = "rgba(8,18,32,.94)"; X.fill(); X.strokeStyle = "#2b5084"; X.lineWidth = 1.2; X.stroke(); if (title) { T(title, x + 14, y + 20, 14, "#9fd0ff", "left", 600); X.fillStyle = "#1f3e63"; X.fillRect(x + 10, y + 36, w - 20, 1); } X.restore(); }
function ring(x, y, r, col, a) { X.save(); X.globalAlpha = a; X.strokeStyle = col; X.lineWidth = 3; X.shadowColor = col; X.shadowBlur = 14; X.beginPath(); X.arc(x, y, r, 0, 6.3); X.stroke(); X.restore(); }

/* ================= Tilldela scenens delar ================= */
const PAL = ["#0b3d91", "#1565c0", "#1e88e5", "#29b6f6", "#4dd0e1", "#80deea", "#b2ebf2", "#e0f7fa"];
function inPoly(x, y, P) { let c = false; for (let i = 0, j = P.length - 1; i < P.length; j = i++) if ((P[i][1] > y) !== (P[j][1] > y) && x < (P[j][0] - P[i][0]) * (y - P[i][1]) / (P[j][1] - P[i][1]) + P[i][0]) c = !c; return c; }
const VOLP = [[-2, -8.5], [9, -8], [9.2, 1.5], [-2, 1]], LEVEL = -0.3;
function volNums(n) { let cut = 0, fill = 0; const st = 0.25; for (let x = -2; x <= 9.2; x += st) for (let y = -8.5; y <= 1.5; y += st) if (inPoly(x, y, VOLP)) { const d = hgt(x, y) - LEVEL; if (d > 0) cut += d * st * st; else fill -= d * st * st; } return [cut * n, fill * n]; }
const PA = [-20, -8], PB0 = [20, 6];
function profB(t) { const k = ease(seg(t, 93, 95.5)); return [PB0[0], lerp(PB0[1], 14, k)]; }

/* ================= Scenen (3D-vyn) ================= */
function scene(t) {
  X.save(); X.beginPath(); X.rect(VX, VY, VW, VH); X.clip();
  const bg = X.createLinearGradient(0, VY, 0, VY + VH); bg.addColorStop(0, "#0c1a2e"); bg.addColorStop(1, "#050b14"); X.fillStyle = bg; X.fillRect(VX, VY, VW, VH);
  setCam(t);
  const ptsP = easeOut(seg(t, 32.2, 35.6)) * 40, pdfP = ease(seg(t, 25, 26.2)), ifcP = t < 28.5 ? 0 : ease(seg(t, 28.5, 31)), cranes = easeOut(seg(t, 58, 60.5)), cabins = easeOut(seg(t, 61, 62.5));
  // snitt
  const a5 = t - 66; let cx = 99; if (a5 >= 3 && a5 < 13) cx = lerp(30, -4, ease(seg(a5, 3, 11))); else if (a5 >= 13 && a5 < 14.2) cx = lerp(-4, 40, ease((a5 - 13) / 1.2));
  const Bn = profB(t), dl = Math.hypot(Bn[0] - PA[0], Bn[1] - PA[1]), nx = -(Bn[1] - PA[1]) / dl, ny = (Bn[0] - PA[0]) / dl; let ps = 99;
  if (t >= 89 && t < 99.5) ps = t < 99 ? lerp(30, 0, ease(seg(t, 89, 92))) : lerp(0, 30, ease(seg(t, 99, 99.5)));
  const sideOf = (x, y) => (x - PA[0]) * nx + (y - PA[1]) * ny, hidden = (x, y) => x > cx || sideOf(x, y) > ps;
  // PDF-ritning
  if (pdfP > 0.01) { const c = [[-22, -18], [22, -18], [22, 18], [-22, 18]].map(([x, y]) => pt2(x, y, 0.05)); if (c.every(Boolean)) { X.save(); X.globalAlpha = 0.5 * pdfP; X.fillStyle = "#cfe3ff"; X.beginPath(); c.forEach((p, i) => i ? X.lineTo(...p) : X.moveTo(...p)); X.closePath(); X.fill(); X.globalAlpha = 0.9 * pdfP; X.strokeStyle = "#2a5a9a"; X.lineWidth = 1.4; X.beginPath(); for (let i = -5; i <= 5; i++) { const a = pt2(i * 4, -18, 0.06), b = pt2(i * 4, 18, 0.06), cc = pt2(-22, i * 3.4, 0.06), d = pt2(22, i * 3.4, 0.06); if (a && b) { X.moveTo(...a); X.lineTo(...b); } if (cc && d) { X.moveTo(...cc); X.lineTo(...d); } } X.stroke(); X.restore(); } }
  // punkter
  const bk = PAL.map(() => []), vb = [[], [], []]; const vol = t >= 100 && t < 118 ? ease(seg(t, 104.5, 105.5)) : 0, volOn = vol > 0.01 && t >= 106 - 1;
  for (const p of TER) { if (p.r > ptsP) continue; if (hidden(p.x, p.y)) continue; const q = pr(p.x, p.y, p.z); if (!q) continue; const s = clamp(FOC * 0.05 / q[2], 1.4, 3.4); if (volOn && inPoly(p.x, p.y, VOLP)) { vb[p.z - LEVEL > 0.15 ? 0 : p.z - LEVEL < -0.15 ? 1 : 2].push(q[0], q[1], s * 1.4); continue; } bk[clamp(Math.floor((p.z + 3) / 6.5 * 8), 0, 7)].push(q[0], q[1], s); }
  X.globalAlpha = 0.95; bk.forEach((arr, k) => { X.fillStyle = PAL[k]; X.beginPath(); for (let i = 0; i < arr.length; i += 3) X.rect(arr[i], arr[i + 1], arr[i + 2], arr[i + 2]); X.fill(); }); ["#1e6bff", "#ff4d3d", "#c9d6ea"].forEach((c, k) => { X.fillStyle = c; X.beginPath(); for (let i = 0; i < vb[k].length; i += 3) X.rect(vb[k][i], vb[k][i + 1], vb[k][i + 2], vb[k][i + 2]); X.fill(); }); X.globalAlpha = 1;
  if (ptsP > 0.5 && ptsP < 39) { X.fillStyle = "#fff"; for (const p of TER) if (Math.abs(p.r - ptsP) < 0.6 && !hidden(p.x, p.y)) { const q = pr(p.x, p.y, p.z); if (q) X.fillRect(q[0] - 2, q[1] - 2, 4, 4); } }
  // IFC
  const edges = [[0, 1], [1, 2], [2, 3], [3, 0], [4, 5], [5, 6], [6, 7], [7, 4], [0, 4], [1, 5], [2, 6], [3, 7]];
  const drawBox = (x, y, w, d, z0, h, col, fill) => { const x0 = x - w / 2, x1 = x + w / 2, y0 = y - d / 2, y1 = y + d / 2, V = [[x0, y0], [x1, y0], [x1, y1], [x0, y1]], pp = []; for (const zz of [z0, z0 + h]) for (const [a, b] of V) pp.push(pt2(a, b, zz)); if (fill && pp[4] && pp[5] && pp[6] && pp[7]) { X.fillStyle = fill; X.beginPath(); X.moveTo(...pp[4]); X.lineTo(...pp[5]); X.lineTo(...pp[6]); X.lineTo(...pp[7]); X.fill(); } X.strokeStyle = col; X.lineWidth = 2; X.beginPath(); for (const [i, j] of edges) if (pp[i] && pp[j]) { X.moveTo(...pp[i]); X.lineTo(...pp[j]); } X.stroke(); };

  // kran + bodar
  if (cranes > 0.01 && !hidden(-14, 12)) { const bx = -14, by = 12, z0 = hgt(bx, by), top = z0 + 20 * cranes, ang = t * 0.25, jx = bx + Math.cos(ang) * 14 * cranes, jy = by + Math.sin(ang) * 14 * cranes, cxx = bx - Math.cos(ang) * 5 * cranes, cyy = by - Math.sin(ang) * 5 * cranes, a = pt2(bx, by, z0), b = pt2(bx, by, top), j = pt2(jx, jy, top), cc = pt2(cxx, cyy, top), h = pt2(jx, jy, top - 6 * cranes); X.save(); X.strokeStyle = "#ffcb2e"; X.lineWidth = 3; X.shadowColor = "#ffcb2e"; X.shadowBlur = 8; X.beginPath(); if (a && b) { X.moveTo(...a); X.lineTo(...b); } if (b && j) { X.moveTo(...b); X.lineTo(...j); } if (b && cc) { X.moveTo(...b); X.lineTo(...cc); } X.stroke(); X.lineWidth = 1; if (j && h) { X.beginPath(); X.moveTo(...j); X.lineTo(...h); X.stroke(); } X.restore(); }
  if (cabins > 0.01) for (const [x, y] of [[12, -1], [15, -1], [18, -1]]) if (!hidden(x, y)) drawBox(x, y, 2.6, 2.4, hgt(x, y), 2.4 * cabins, "#ffcb2e", "rgba(255,203,46,.18)");
  // markering vid placering/snap (kapitel 4)
  if (t >= 62.5 && t < 64.4) { const k = seg(t, 62.5, 64.4), x = lerp(12, 15, k), q = pt2(x, 8, hgt(x, 8)); if (q) { drawBox(x, 8, 2.6, 2.4, hgt(x, 8), 2.4, "#ffe58a", "rgba(255,230,140,.25)"); } }
  // saxens snittplan
